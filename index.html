<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor Engine — Advanced Canva & Document Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@300;400;600;700&family=Lato:wght@300;400;700&family=Montserrat:wght@400;600;700&family=Oswald:wght@400;600&family=Playfair+Display:wght@400;600;700&family=Merriweather:wght@300;400;700&family=Fira+Code:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- MathJax & ABCjs CDNs & Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-audio.css" />
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
    <!-- PDF.js for client-side PDF-to-image rendering (OCR support) -->
    <script>
      // Lazily initialize PDF.js from CDN when first needed
      window.__pdfjsReady = false;
      window.__loadPdfJs = function() {
        return new Promise(function(resolve, reject) {
          if (window.pdfjsLib && window.__pdfjsReady) { resolve(window.pdfjsLib); return; }
          var script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          script.onload = function() {
            if (window.pdfjsLib) {
              window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
              window.__pdfjsReady = true;
              resolve(window.pdfjsLib);
            } else {
              reject(new Error('PDF.js failed to load from CDN.'));
            }
          };
          script.onerror = function() { reject(new Error('PDF.js CDN script failed to load. Check network connection.')); };
          document.head.appendChild(script);
        });
      };
    </script>
  </head>
  <body class="bg-[#0f172a] text-slate-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
